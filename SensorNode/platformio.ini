; PlatformIO Project Configuration File
; Home sensor nodes - ESP32-C6
;
; Environments:
;   node_pmsa_bme280      BME280 + PMSA003I  (balcony)   - USB upload
;   node_pmsa_bme280_ota  same, uploaded over WiFi
;   node_bme688_scd41     BME688 + SCD41     (bedroom)   - USB upload
;   node_bme688_scd41_ota same, uploaded over WiFi
;   scanner               I2C address scanner, minimal build
;   native                host-side unit tests (no board)
;
; NOTE: [esp32_base] is a plain section, not [env]. Nothing inherits it
; unless it says "extends", which keeps board/framework out of [env:native].

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Native USB-JTAG: don't let the monitor toggle DTR/RTS on connect,
; it can drop the chip into the bootloader.
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -Wall -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bertmelis/espMqttClient@^1.7.3

; --- OTA upload settings, shared by both *_ota environments -------------
; OTA_PASS comes from the shell:  export OTA_PASS=...
; Keeping it out of this file means platformio.ini stays safe to commit.
[ota_base]
upload_protocol = espota
upload_flags =
    --auth=${sysenv.OTA_PASS}
    --host_port=3232

; --- NODE 1: BME688 & SCD41 (bedroom) ----------------------------------
[env:node_bme688_scd41]
extends = esp32_base
build_src_filter = +<*> -<sensors_bme280_pmsa003i.cpp> -<i2c_scanner.cpp>
build_flags =
    ${esp32_base.build_flags}
    -D NODE_TOPIC='"flat/bedroom/state"'
    -D NODE_NAME='"bedroom"'
lib_deps =
    ${esp32_base.lib_deps}
    adafruit/Adafruit BME680 Library@^2.0.6
    sensirion/Sensirion I2C SCD4x@^1.1.0

[env:node_bme688_scd41_ota]
extends = env:node_bme688_scd41, ota_base
upload_port = bedroom.local

; --- NODE 2: PMSA003I & BME280 (balcony) -------------------------------
[env:node_pmsa_bme280]
extends = esp32_base
build_src_filter = +<*> -<sensors_bme688_scd41.cpp> -<i2c_scanner.cpp>
build_flags =
    ${esp32_base.build_flags}
    -D NODE_TOPIC='"flat/balcony/state"'
    -D NODE_NAME='"balcony"'
lib_deps =
    ${esp32_base.lib_deps}
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit PM25 AQI Sensor@^2.0.0

[env:node_pmsa_bme280_ota]
extends = env:node_pmsa_bme280, ota_base
upload_port = balcony.local

; --- I2C address scanner (bring-up tool) -------------------------------
[env:scanner]
extends = esp32_base
build_src_filter = +<i2c_scanner.cpp>
lib_deps =

; --- Host unit tests ---------------------------------------------------
; No board / framework: payload.cpp is plain C++ and compiles natively.
; test_build_src is what makes src/ get compiled alongside test/.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<payload.cpp>
build_flags = -std=c++17